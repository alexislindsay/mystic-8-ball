<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Pure Circular Clip so NOTHING exists outside the 8-Ball -->
    <clipPath id="sphereClip">
      <circle cx="256" cy="256" r="244"/>
    </clipPath>

    <!-- Black Galaxy / Nebula 8-Ball Outer Sphere Gradient -->
    <radialGradient id="galaxyBall" cx="34%" cy="26%" r="74%">
      <stop offset="0%" stop-color="#3b2070"/>
      <stop offset="18%" stop-color="#17143a"/>
      <stop offset="46%" stop-color="#070814"/>
      <stop offset="78%" stop-color="#020307"/>
      <stop offset="94%" stop-color="#0f1b3d"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </radialGradient>

    <!-- Recessed Metallic 8-Ball Window Bezel Gradient -->
    <linearGradient id="windowBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Deep Dark-Blue / Nebula Liquid Portal Window -->
    <radialGradient id="portalLiquid" cx="50%" cy="50%" r="52%">
      <stop offset="0%" stop-color="#102454"/>
      <stop offset="58%" stop-color="#070f2b"/>
      <stop offset="100%" stop-color="#01030a"/>
    </radialGradient>

    <!-- Curved Glass Lens Reflection Over the 8-Ball Window -->
    <linearGradient id="windowGlass" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="38%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.14"/>
    </linearGradient>

    <!-- Realistic Side-Profile Upper Forewing Gradient -->
    <linearGradient id="wingFore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.96"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="72%" stop-color="#8b5cf6" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0.94"/>
    </linearGradient>

    <!-- Realistic Elongated Lower Hindwing Gradient -->
    <linearGradient id="wingHind" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.92"/>
      <stop offset="48%" stop-color="#8b5cf6" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.94"/>
    </linearGradient>

    <!-- Bioluminescent Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feGaussianBlur stdDeviation="9" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#sphereClip)">
    <!-- 1. Outer 3D Black Galaxy / Nebula 8-Ball Sphere -->
    <circle cx="256" cy="256" r="244" fill="url(#galaxyBall)"/>

    <!-- Subtle Galaxy Stars on Outer Sphere -->
    <g fill="#ffffff" opacity="0.7">
      <circle cx="72" cy="148" r="1.4"/><circle cx="436" cy="152" r="1.6"/>
      <circle cx="118" cy="72" r="1.2"/><circle cx="388" cy="78" r="1.4"/>
      <circle cx="64" cy="312" r="1.5"/><circle cx="442" cy="306" r="1.5"/>
      <circle cx="132" cy="436" r="1.6"/><circle cx="378" cy="432" r="1.4"/>
    </g>

    <!-- Outer Sphere Top-Left Specular Gloss Highlight -->
    <ellipse cx="168" cy="96" rx="88" ry="34" transform="rotate(-26 168 96)" fill="#ffffff" fill-opacity="0.22"/>

    <!-- 2. Classic Recessed 8-Ball Window Bezel & Liquid Portal -->
    <circle cx="256" cy="260" r="186" fill="url(#windowBezel)" stroke="#475569" stroke-opacity="0.6" stroke-width="3"/>
    <circle cx="256" cy="260" r="172" fill="url(#portalLiquid)" stroke="#1e293b" stroke-width="4"/>
    <circle cx="256" cy="260" r="172" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- ================= LEFT BUTTERFLY (SPANNING FULL TRIANGLE SIDE + LONGER LOWER WING) ================= -->
    <!-- Triangle left wall runs from apex (256,162) to bottom-left corner (156,342) -->
    <g filter="url(#neonGlow)">
      <!-- Left Butterfly Body & Legs Spanning Most of the Left Triangle Side -->
      <path d="M 240 184 C 220 220, 194 266, 170 312" stroke="#e0f2fe" stroke-width="5.5" stroke-linecap="round" fill="none"/>
      <circle cx="243" cy="178" r="4.5" fill="#e0f2fe"/>
      <!-- Antennae near peak -->
      <path d="M 244 174 C 242 154, 232 142, 220 138 M 245 175 C 247 156, 240 144, 230 138" stroke="#67e8f9" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <!-- Legs gripping the pyramid wall -->
      <path d="M 232 198 L 240 206 M 216 228 L 224 236 M 198 260 L 206 268 M 182 290 L 190 298" stroke="#bae6fd" stroke-width="1.6" stroke-linecap="round"/>

      <!-- Left Elongated Lower Hindwing (extending much longer down past the bottom-left corner of triangle) -->
      <path d="M 206 244
               C 156 238, 106 248, 96 286
               C 88 316, 104 348, 122 368
               C 134 382, 148 378, 152 358
               C 156 342, 162 328, 170 314 Z"
            fill="url(#wingHind)" fill-opacity="0.48" stroke="#f472b6" stroke-width="2.4" stroke-linejoin="round"/>

      <!-- Left Upper Forewing (sweeping HIGH and UPWARD in realistic resting profile) -->
      <path d="M 238 186
               C 208 122, 152 88, 114 104
               C 92 114, 86 150, 96 184
               C 106 218, 154 242, 212 248 Z"
            fill="url(#wingFore)" fill-opacity="0.5" stroke="#67e8f9" stroke-width="2.6" stroke-linejoin="round"/>

      <!-- Realistic Anatomical Wing Cells & Glowing Filigree Veins (Left Upper & Elongated Lower) -->
      <path d="M 232 194 C 192 146, 152 122, 102 124
               M 192 152 C 164 126, 138 110, 118 104
               M 182 168 C 148 156, 116 148, 92 148
               M 202 204 C 160 194, 122 188, 96 184
               M 208 228 C 164 218, 126 216, 104 218
               M 198 258 C 156 256, 120 266, 98 286
               M 188 278 C 152 286, 122 306, 108 334
               M 178 298 C 154 316, 138 342, 136 372"
            fill="none" stroke="#e0f2fe" stroke-width="1.6" stroke-opacity="0.92" stroke-linecap="round"/>

      <!-- Glowing Stardust Spots Along Upper & Elongated Lower Wing Margins (Left) -->
      <circle cx="114" cy="116" r="3.4" fill="#ffffff"/><circle cx="102" cy="138" r="3" fill="#67e8f9"/>
      <circle cx="100" cy="162" r="2.8" fill="#e0f2fe"/><circle cx="106" cy="188" r="2.6" fill="#f0abfc"/>
      <circle cx="108" cy="274" r="3" fill="#67e8f9"/><circle cx="106" cy="302" r="3.2" fill="#ffffff"/>
      <circle cx="116" cy="330" r="3" fill="#f472b6"/><circle cx="134" cy="358" r="2.8" fill="#ffffff"/>
    </g>

    <!-- ================= RIGHT BUTTERFLY (SPANNING FULL TRIANGLE SIDE + LONGER LOWER WING) ================= -->
    <!-- Triangle right wall runs from apex (256,162) to bottom-right corner (356,342) -->
    <g filter="url(#neonGlow)">
      <!-- Right Butterfly Body & Legs Spanning Most of the Right Triangle Side -->
      <path d="M 272 184 C 292 220, 318 266, 342 312" stroke="#e0f2fe" stroke-width="5.5" stroke-linecap="round" fill="none"/>
      <circle cx="269" cy="178" r="4.5" fill="#e0f2fe"/>
      <!-- Antennae near peak -->
      <path d="M 268 174 C 270 154, 280 142, 292 138 M 267 175 C 265 156, 272 144, 282 138" stroke="#67e8f9" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <!-- Legs gripping the pyramid wall -->
      <path d="M 280 198 L 272 206 M 296 228 L 288 236 M 314 260 L 306 268 M 330 290 L 322 298" stroke="#bae6fd" stroke-width="1.6" stroke-linecap="round"/>

      <!-- Right Elongated Lower Hindwing (extending much longer down past the bottom-right corner of triangle) -->
      <path d="M 306 244
               C 356 238, 406 248, 416 286
               C 424 316, 408 348, 390 368
               C 378 382, 364 378, 360 358
               C 356 342, 350 328, 342 314 Z"
            fill="url(#wingHind)" fill-opacity="0.48" stroke="#f472b6" stroke-width="2.4" stroke-linejoin="round"/>

      <!-- Right Upper Forewing (sweeping HIGH and UPWARD in realistic resting profile) -->
      <path d="M 274 186
               C 304 122, 360 88, 398 104
               C 420 114, 426 150, 416 184
               C 406 218, 358 242, 300 248 Z"
            fill="url(#wingFore)" fill-opacity="0.5" stroke="#67e8f9" stroke-width="2.6" stroke-linejoin="round"/>

      <!-- Realistic Anatomical Wing Cells & Glowing Filigree Veins (Right Upper & Elongated Lower) -->
      <path d="M 280 194 C 320 146, 360 122, 410 124
               M 320 152 C 348 126, 374 110, 394 104
               M 330 168 C 364 156, 396 148, 420 148
               M 310 204 C 352 194, 390 188, 416 184
               M 304 228 C 348 218, 386 216, 408 218
               M 314 258 C 356 256, 392 266, 414 286
               M 324 278 C 360 286, 390 306, 404 334
               M 334 298 C 358 316, 374 342, 376 372"
            fill="none" stroke="#e0f2fe" stroke-width="1.6" stroke-opacity="0.92" stroke-linecap="round"/>

      <!-- Glowing Stardust Spots Along Upper & Elongated Lower Wing Margins (Right) -->
      <circle cx="398" cy="116" r="3.4" fill="#ffffff"/><circle cx="410" cy="138" r="3" fill="#67e8f9"/>
      <circle cx="412" cy="162" r="2.8" fill="#e0f2fe"/><circle cx="406" cy="188" r="2.6" fill="#f0abfc"/>
      <circle cx="404" cy="274" r="3" fill="#67e8f9"/><circle cx="406" cy="302" r="3.2" fill="#ffffff"/>
      <circle cx="396" cy="330" r="3" fill="#f472b6"/><circle cx="378" cy="358" r="2.8" fill="#ffffff"/>
    </g>

    <!-- 3. Classic Glowing White Pyramid / Triangle Inside the Portal Window -->
    <polygon points="256,162 356,342 156,342"
             fill="none"
             stroke="#ffffff"
             stroke-width="14"
             stroke-linejoin="miter"
             stroke-miterlimit="10"
             filter="url(#neonGlow)"/>

    <!-- 4. Curved Glass Window Lens Highlight Over the Portal -->
    <ellipse cx="236" cy="158" rx="94" ry="44" transform="rotate(-18 236 158)" fill="url(#windowGlass)"/>
  </g>

  <!-- Outer Crisp 8-Ball Sphere Rim -->
  <circle cx="256" cy="256" r="243" fill="none" stroke="#60a5fa" stroke-opacity="0.38" stroke-width="2"/>
</svg>
